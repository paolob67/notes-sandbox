name: S17 approve check
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
permissions: {}
jobs:
  attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - name: Attempt reviews
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          for ev in APPROVE REQUEST_CHANGES; do
            printf '%s: ' "$ev"
            gh api -i -X POST "repos/$R/pulls/$PR/reviews" -f event="$ev" -f body="S17 probe (sandbox): $ev attempt" 2>&1 \
              | grep -iE '^(HTTP/|\{)' | tr '\r\n' '  '
            echo
          done
